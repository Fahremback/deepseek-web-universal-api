name: Python tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and official SDKs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openai anthropic
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline integration tests
        run: python -m unittest -q test_openai_bridge test_media test_auto_continue test_streaming test_credential_store
      - name: Verify PoW and SSE parsers
        run: python api_client.py --selftest
