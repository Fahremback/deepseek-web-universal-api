name: Python tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and official SDKs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openai anthropic
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline integration tests
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Verify PoW and SSE parsers
        run: python api_client.py --selftest
